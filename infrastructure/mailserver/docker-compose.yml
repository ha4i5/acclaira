services:
  mailserver:
    image: analogic/poste.io:latest
    container_name: mailserver
    restart: always
    environment:
      - HTTPS=OFF
      - HTTP_PORT=80
      - HTTPS_PORT=443
      - DISABLE_CLAMAV=TRUE
      - DISABLE_RSPAMD=FALSE
      - TZ=UTC
    ports:
      - "25:25"
      - "110:110"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - /opt/mailserver/data:/data
      - /opt/mailserver/custom/login.html:/opt/www/webmail/skins/elastic/templates/login.html:ro
      - /opt/mailserver/custom/admin-login.html.twig:/opt/admin/templates/Base/Security/login.html.twig:ro
      - /opt/mailserver/custom/admin-base.html.twig:/opt/admin/templates/base.html.twig:ro
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "mail.acclaira.com:127.0.0.1"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.mailserver-http.rule=Host(`mail.acclaira.com`)"
      - "traefik.http.routers.mailserver-http.entrypoints=http"
      - "traefik.http.routers.mailserver-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.mailserver-http.service=mailserver"
      - "traefik.http.routers.mailserver-https.rule=Host(`mail.acclaira.com`)"
      - "traefik.http.routers.mailserver-https.entrypoints=https"
      - "traefik.http.routers.mailserver-https.tls=true"
      - "traefik.http.routers.mailserver-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.mailserver.loadbalancer.server.port=80"
    networks:
      - coolify
      - default

networks:
  coolify:
    external: true
  default:
